CONFIG_BUILD_WITH_TFM=y
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_TFM_CONNECTION_BASED_SERVICE_API=y

# Threading and timing
CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=4096

# Console output
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_CBPRINTF_FP_SUPPORT=y


# Timing functions for precise measurements
CONFIG_TIMING_FUNCTIONS=y

# Note: For STM32L5, we may need to configure TIM2 separately
# This will be done in the application code using HAL or device tree

#config for fine tune the same value
CONFIG_SIZE_OPTIMIZATIONS=y
# CONFIG_SYS_CLOCK_TICKS_PER_SEC=50000
CONFIG_TICKLESS_KERNEL=n